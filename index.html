<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Policial Resgata o Gato 3D</title>
<style>
:root{--card:#14223d;--ac:#ffd34d;--hpbg:#12091f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1626;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
#hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(4px + env(safe-area-inset-top,0px)) 10px 0;text-align:center;background:transparent;pointer-events:none}
#hud b{font-size:17px;letter-spacing:1px}
#bn{display:block;margin:0 auto 3px;font-family:'Cinzel Decorative',Georgia,'Times New Roman',serif;font-size:21px;font-weight:900;letter-spacing:6px;padding-left:6px;line-height:1;background:linear-gradient(180deg,#fff4d2 0%,#f0c15a 45%,#b9812a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 1px 0 #3a2208) drop-shadow(0 3px 4px #000c)}
#bw{position:relative;height:26px;margin:0 auto;max-width:520px;filter:drop-shadow(0 4px 5px #0009)}
#bw::before,#bw::after{content:'';position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aeb7c0 45%,#4a525b);box-shadow:0 0 0 1.5px #1c2128;z-index:3}
#bw::before{left:10px}#bw::after{right:10px}
#bw.hit{animation:hs .28s}@keyframes hs{20%{transform:translateX(-3px)}45%{transform:translateX(3px)}70%{transform:translateX(-1.5px)}}
#bar{position:absolute;left:24px;right:24px;top:3px;height:20px;border-radius:7px;overflow:hidden;border:3px solid transparent;background:linear-gradient(#0a0305,#1c070b) padding-box,linear-gradient(180deg,#f4f7fa 0%,#aab4be 28%,#69737d 55%,#2f363e 80%,#8a949e 100%) border-box;box-shadow:0 0 0 1px #12161b,inset 0 2px 4px #000c}
#ghost{position:absolute;left:0;top:0;height:100%;width:100%;background:linear-gradient(180deg,#ffd9a0,#ff9a4a);opacity:.9;transition:width 1s .45s}
#fill{position:absolute;left:0;top:0;height:100%;width:100%;transition:width .35s cubic-bezier(.22,.8,.3,1);overflow:hidden;background:linear-gradient(180deg,#ff6a6a 0,#e32638 30%,#b3121f 62%,#6e0a13 100%);box-shadow:0 0 10px #ff2d3d99}
#fill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#fff0 0 14px,#ffffff14 14px 16px)}
#fill::before{content:'';position:absolute;right:0;top:0;bottom:0;width:6px;background:linear-gradient(90deg,#fff0,#ffd2c8cc);z-index:1}
#bar.hit #fill{animation:hf .4s}@keyframes hf{0%{filter:brightness(2.4) saturate(.6)}100%{filter:none}}
#gloss{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#ffffff70 0,#ffffff1c 42%,#fff0 43%,#fff0 70%,#0006 100%);box-shadow:inset 0 0 5px #000a}
#bar.low{animation:lw .6s infinite alternate}@keyframes lw{to{box-shadow:0 0 0 1px #12161b,inset 0 2px 4px #000c,0 0 14px #ff2d2d}}
#hptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;font:800 11px system-ui,-apple-system,sans-serif;letter-spacing:1px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#say{position:absolute;right:5%;top:22%;background:linear-gradient(#fff,#dcecff);color:#1b2342;font-weight:900;padding:9px 16px;border-radius:20px;border:3px solid #1b2342;font-size:20px;box-shadow:0 5px 12px #0006;opacity:0;transform:scale(.85);transform-origin:80% 100%;transition:opacity .15s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#say::before,#say::after,#bsay::before,#bsay::after{content:'';position:absolute;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent}
#say::before{bottom:-20px;right:24px;border-top:17px solid #1b2342}#say::after{bottom:-13px;right:27px;border-left-width:6px;border-right-width:6px;border-top:13px solid #dcecff}
#bsay::before{bottom:-20px;left:28px;border-top:17px solid #5a0010}#bsay::after{bottom:-13px;left:31px;border-left-width:6px;border-right-width:6px;border-top:13px solid #ffc9cf}
#log{position:absolute;left:10px;bottom:98px;font-size:14px;font-weight:700;padding:6px 14px 6px 8px;border-radius:22px;background:linear-gradient(90deg,#ff3b5ce6,#ff8a3be6);box-shadow:0 3px 10px #0008;border:1.5px solid #fff8;animation:gin .35s}
#log:empty{display:none}#log .gi{font-size:20px;margin-right:6px;vertical-align:-2px}
@keyframes gin{from{transform:translateX(-50px);opacity:0}}
#cta span{display:inline-block;position:relative;overflow:hidden;background:linear-gradient(90deg,#ff2d6f,#ff8a1f);padding:8px 16px;border-radius:22px;border:2px solid #fff;box-shadow:0 4px 14px #0009,0 0 20px #ff4d7aaa;text-shadow:0 2px 3px #0008}
#cta span::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,#fff0,#ffffff90,#fff0);transform:skewX(-20deg);animation:sh 2.2s infinite}
#cta b{color:#fff35c}
#cta .gf{display:inline-block;font-style:normal;font-size:20px;margin-right:6px;vertical-align:-2px;animation:gf 1s infinite}
@keyframes sh{to{left:140%}}@keyframes gf{50%{transform:rotate(14deg) scale(1.2)}}
.fx{position:absolute;font-weight:900;font-size:30px;color:#ffd34d;text-shadow:0 2px 4px #000;pointer-events:none;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.5);font-size:26px;font-weight:900;text-align:center;gap:12px}
#win button,#ctrl button{border:0;border-radius:12px;background:var(--ac);color:#14223d;font-weight:800}
#win button{font-size:16px;padding:10px 20px}
#ctrl{display:flex;gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#14223d}
#ctrl button{flex:1;padding:9px 2px;font-size:13px}
#tg{position:absolute;right:8px;bottom:8px;background:#0008;border:0;border-radius:10px;color:#fff;font-size:16px;padding:4px 8px;opacity:.5}
#bsay{position:absolute;left:4%;top:max(28%,160px);max-width:55%;background:linear-gradient(#fff0f0,#ffc9cf);color:#8a0014;font-weight:900;padding:8px 14px;border-radius:18px;border:3px solid #5a0010;font-size:16px;box-shadow:0 5px 12px #0006;opacity:0;transform:scale(.85);transform-origin:20% 100%;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#top{position:absolute;right:8px;top:76px;font-size:12px;font-weight:700;background:#0006;padding:6px 9px;border-radius:10px;white-space:pre-line;text-shadow:0 1px 2px #000}
#lvl{position:absolute;left:8px;top:76px;font-weight:900;background:#ffd34d;color:#14223d;padding:3px 10px;border-radius:10px;font-size:13px}
#cta{position:absolute;left:0;right:0;bottom:16px;padding:0 58px 0 12px;text-align:center;font-size:14px;font-weight:900;animation:pl 1.2s infinite}
@keyframes pl{50%{transform:scale(1.06)}}
#combo{position:absolute;left:8px;top:108px;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 10px;border-radius:16px;background:linear-gradient(135deg,#ff9f1a,#ff3d5a);border:2px solid #fff;box-shadow:0 4px 12px #0008,0 0 14px #ff7a3a99;color:#fff;font-weight:900;white-space:nowrap;text-shadow:0 2px 3px #0008;opacity:0;transition:opacity .3s;transform-origin:left center;pointer-events:none}
#combo .cl{font-size:10px;letter-spacing:1.5px}#combo b{font-size:24px;line-height:1;color:#fff35c}#combo em{font-style:normal;font-size:11px;background:#0005;border-radius:10px;padding:2px 7px}
@keyframes pop{from{transform:scale(1.8)}}
#fxr{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:7}.fl{position:absolute;top:-30px;animation:fall 3s linear forwards;will-change:transform}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.wc{background:linear-gradient(135deg,#ffd34d,#ff8a1f);color:#3a1a00;padding:10px 24px;border-radius:18px;font-size:15px;border:3px solid #fff;box-shadow:0 6px 20px #000a;animation:pop .4s}.wc b{font-size:28px;display:block;line-height:1.2}.wc small{font-size:13px;font-weight:700}.wn{font-size:14px;font-weight:700}

#gp{position:absolute;right:4px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px;z-index:6}
.gb{width:46px;background:none;border:0;padding:0;color:#fff;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;transition:transform .12s;font-family:inherit}
.gb:active,.gb.pp{transform:scale(1.22)}
.gb svg,.gb .em{width:28px;height:28px;filter:drop-shadow(0 2px 2px #0009)}
.gb .em{font-size:24px;line-height:28px}
.gb span{font-size:6px;font-weight:900;line-height:1.05;text-align:center;color:#fff;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;margin-top:1px}
.gb i{font-style:normal;font-size:7px;font-weight:800;background:#000a;border-radius:6px;padding:0 4px;margin-top:1px;color:#ffd34d}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet"></head><body>
